name: TS — lint + typecheck + tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Bun workspace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format check)
        run: bun run lint

      - name: TypeScript (typecheck)
        run: bun run typecheck

      - name: Tests
        run: |
          if [ -d apps ] && find apps packages -name "*.test.ts" -print -quit | grep -q .; then
            bun test
          else
            echo "No test files yet — skipping. Tests land per feature."
          fi
