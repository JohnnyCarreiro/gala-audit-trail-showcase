[package]
name = "dto-signer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Thin CLI on top of dto-canon — reads a DTO + private key from stdin, emits canonical bytes + signature."

[dependencies]
dto-canon = { path = "../../crates/dto-canon" }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
k256 = { workspace = true }
anyhow = "1"

[lints]
workspace = true

[[bin]]
name = "dto-signer"
path = "src/main.rs"
