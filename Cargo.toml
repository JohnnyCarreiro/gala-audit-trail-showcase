[workspace]
resolver = "2"
members = [
    "crates/dto-canon",
    "apps/audit-verifier",
    "apps/dto-signer",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Johnny Carreiro <jcarreiropublicidade@gmail.com>"]
repository = "https://github.com/JohnnyCarreiro/gala-audit-trail-showcase"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Aligns with the playbook: no unwrap / expect / panic in production code.
# Tests opt out via `#[allow(clippy::unwrap_used)]` at module scope.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
