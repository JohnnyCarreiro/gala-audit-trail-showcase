[workspace]
resolver = "2"
members = [
    "crates/dto-canon",
    "apps/audit-verifier",
    "apps/dto-signer",
]

[workspace.package]
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Johnny Carreiro <jcarreiropublicidade@gmail.com>"]
repository = "https://github.com/JohnnyCarreiro/gala-audit-trail-showcase"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# NB: `preserve_order` is intentionally OFF. Default serde_json::Map is a
# BTreeMap which sorts keys alphabetically — exactly what we need for
# canonical JSON. Enabling preserve_order here would silently break
# byte-equivalence with the TS chaincode's signing input.
serde_json = "1"
thiserror = "2"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Aligns with the playbook: no unwrap / expect / panic in production code.
# Tests opt out via `#[allow(clippy::unwrap_used)]` at module scope.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
